name: Node.js Automated Testing CI

# Kích hoạt pipeline khi có code mới được đẩy lên nhánh main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest # Chạy trên máy chủ đám mây Linux của GitHub

    steps:
    # Bước 1: Tải mã nguồn của bạn về máy chủ
    - name: Checkout repository
      uses: actions/checkout@v4

    # Bước 2: Cài đặt Node.js phiên bản 20
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    # Bước 3: Cài đặt các thư viện cần thiết (bao gồm Jest)
    - name: Install dependencies
      run: npm ci

    # Bước 4: Chạy lệnh kiểm thử tự động
    - name: Run Unit Tests
      run: npm test